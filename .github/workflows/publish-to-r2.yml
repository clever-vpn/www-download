name: Publish Apps To R2

on:
  workflow_dispatch:
    inputs:
      directory:
        description: Top-level R2 directory to sync, for example stable, test or v2.1.2
        required: true
        type: string
      tag:
        description: Optional existing tag to publish from, for example v2.1.2. Defaults to the branches/main HEAD
        required: false
        type: string
      apps:
        description: Comma-separated target_dir values to publish, or all
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          api="repos/${GITHUB_REPOSITORY}"

          if [[ -n "${INPUT_TAG}" ]]; then
            stderr_file="$(mktemp)"
            if ! gh api "${api}/git/ref/tags/${INPUT_TAG}" --silent 2>"${stderr_file}"; then
              if grep -q "HTTP 404" "${stderr_file}"; then
                echo "Tag ${INPUT_TAG} does not exist in ${GITHUB_REPOSITORY}." >&2
                echo "Create it first, or leave the tag input empty to publish from the branches/main HEAD." >&2
              else
                echo "Could not look up tag ${INPUT_TAG}:" >&2
                cat "${stderr_file}" >&2
              fi
              rm -f "${stderr_file}"
              exit 1
            fi
            rm -f "${stderr_file}"

            # /commits/{ref} 会把 annotated tag 剥离到 commit，省掉一次 git/tags 查询
            target_commit="$(gh api "${api}/commits/${INPUT_TAG}" --jq .sha)"
            echo "Publishing from tag ${INPUT_TAG} at ${target_commit}."
          else
            target_commit="$(gh api "${api}/branches/main" --jq .commit.sha)"
            echo "Publishing from branches/main HEAD at ${target_commit}."
          fi

          echo "target_commit=${target_commit}" >>"${GITHUB_OUTPUT}"

      - name: Checkout repository at target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.target_commit }}

      - name: Validate optional Bitwarden source token wiring
        if: ${{ vars.BW_SECRET_ID_SOURCE_GH_TOKEN != '' }}
        env:
          BW_SM_ACCESS_TOKEN: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          BW_SECRET_ID_SOURCE_GH_TOKEN: ${{ vars.BW_SECRET_ID_SOURCE_GH_TOKEN }}
        run: |
          set -euo pipefail
          required_vars=(
            BW_SM_ACCESS_TOKEN
            BW_SECRET_ID_SOURCE_GH_TOKEN
          )

          for required_var in "${required_vars[@]}"; do
            if [[ -z "${!required_var:-}" ]]; then
              echo "Missing required GitHub secret/variable: ${required_var}" >&2
              exit 1
            fi
          done

      - name: Load source GitHub token from Bitwarden
        if: ${{ vars.BW_SECRET_ID_SOURCE_GH_TOKEN != '' }}
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          cloud_region: ${{ vars.BW_CLOUD_REGION || 'us' }}
          secrets: |
            ${{ vars.BW_SECRET_ID_SOURCE_GH_TOKEN }} > SOURCE_GH_TOKEN

      - name: Download source release assets
        env:
          SOURCE_GH_TOKEN: ${{ env.SOURCE_GH_TOKEN }}
          DIRECTORY: ${{ inputs.directory }}
          APPS: ${{ inputs.apps }}
        run: |
          python3 scripts/download_release_assets.py \
            --config config/apps.json \
            --directory "${DIRECTORY}" \
            --apps "${APPS}" \
            --output-dir bundle

      - name: Validate Bitwarden wiring
        env:
          BW_SM_ACCESS_TOKEN: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          BW_SECRET_ID_R2_ACCESS_KEY_ID: ${{ vars.BW_SECRET_ID_R2_ACCESS_KEY_ID }}
          BW_SECRET_ID_R2_SECRET_ACCESS_KEY: ${{ vars.BW_SECRET_ID_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          required_vars=(
            BW_SM_ACCESS_TOKEN
            BW_SECRET_ID_R2_ACCESS_KEY_ID
            BW_SECRET_ID_R2_SECRET_ACCESS_KEY
          )

          for required_var in "${required_vars[@]}"; do
            if [[ -z "${!required_var:-}" ]]; then
              echo "Missing required GitHub secret/variable: ${required_var}" >&2
              exit 1
            fi
          done

      - name: Load R2 secrets from Bitwarden
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          cloud_region: ${{ vars.BW_CLOUD_REGION || 'us' }}
          secrets: |
            ${{ vars.BW_SECRET_ID_R2_ACCESS_KEY_ID }} > R2_ACCESS_KEY_ID
            ${{ vars.BW_SECRET_ID_R2_SECRET_ACCESS_KEY }} > R2_SECRET_ACCESS_KEY

      - name: Sync platform directories to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          DIRECTORY: ${{ inputs.directory }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          platforms=(bundle/"${DIRECTORY}"/*/)
          if [[ ${#platforms[@]} -eq 0 ]]; then
            echo "Nothing to sync: bundle/${DIRECTORY} has no platform directory." >&2
            exit 1
          fi

          for platform_path in "${platforms[@]}"; do
            platform="$(basename "${platform_path}")"
            echo "::group::Sync ${DIRECTORY}/${platform}"
            aws s3 sync \
              "${platform_path}" \
              "s3://${R2_BUCKET}/${DIRECTORY}/${platform}/" \
              --endpoint-url "${R2_ENDPOINT}" \
              --delete \
              --no-progress
            echo "::endgroup::"
          done

      - name: Summarize the published directory
        env:
          DIRECTORY: ${{ inputs.directory }}
          COMMIT: ${{ steps.resolve.outputs.target_commit }}
        run: |
          set -euo pipefail
          python3 - "${DIRECTORY}" "${COMMIT}" >>"${GITHUB_STEP_SUMMARY}" <<'PY'
          import glob
          import json
          import sys

          directory, commit = sys.argv[1], sys.argv[2]

          print("## R2 directory updated\n")
          print(f"- Directory: `{directory}`")
          print(f"- Published from commit `{commit}`")
          print(
              "- Serve it by pointing KV `download-version` (prod) or "
              "`download-test-version` (test) at this directory.\n"
          )
          print("| Platform | Source repo | Source tag | Files |")
          print("| --- | --- | --- | --- |")
          for path in sorted(glob.glob(f"bundle/{directory}/*/manifest.json")):
              with open(path, encoding="utf-8") as handle:
                  manifest = json.load(handle)
              print(
                  f"| {manifest['platform']} | {manifest['repo']} | "
                  f"{manifest['source_release_tag']} | {len(manifest['assets'])} |"
              )
          PY